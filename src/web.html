<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>punch</title>
<style>
  :root {
    --bg: #12140f;
    --bg-2: #1b1f16;
    --line: #31382a;
    --text: #e4ecd8;
    --dim: #8b967c;
    --lime: #d6ff4a;
    --lime-2: #edffb0;
    --bad: #ff5d3a;
    --warn: #e2b657;
    --ok: #8dffa8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 14px/1.45 ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    min-height: 100vh;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 18px;
    padding: 18px 22px 14px;
    border-bottom: 1px solid var(--line);
  }
  .mark { color: var(--lime); font-weight: 700; letter-spacing: 0.14em; font-size: 18px; }
  .sub { color: var(--dim); }
  #meta { margin-left: auto; color: var(--dim); }
  button, input, select {
    font: inherit;
    color: var(--text);
    background: #10140c;
    border: 1px solid var(--line);
    border-radius: 0;
    padding: 7px 9px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--lime); color: var(--lime-2); }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }
  main { padding: 18px 22px 40px; max-width: 1180px; }
  .login {
    max-width: 460px;
    margin: 8vh auto 0;
    border: 1px solid var(--line);
    background: var(--bg-2);
    padding: 22px;
  }
  .login h1 { margin: 0 0 8px; font-size: 16px; font-weight: 600; color: var(--lime); }
  .login p { margin: 0 0 16px; color: var(--dim); }
  .login input { width: 100%; margin-bottom: 12px; }
  .hidden { display: none !important; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
  .card { border: 1px solid var(--line); padding: 10px 12px; background: var(--bg-2); }
  .card .k { color: var(--dim); font-size: 12px; }
  .card .v { font-size: 20px; margin-top: 4px; color: var(--lime-2); }
  .grid { display: grid; grid-template-columns: 340px 1fr; gap: 12px; }
  .panel { border: 1px solid var(--line); background: var(--bg-2); padding: 12px; }
  .panel h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: 0.08em; color: var(--lime); font-weight: 600; }
  label { display: block; color: var(--dim); margin: 8px 0 4px; font-size: 12px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font-weight: 500; font-size: 12px; }
  .bad { color: var(--bad); }
  .ok { color: var(--ok); }
  .warn { color: var(--warn); }
  .err { color: var(--bad); min-height: 1.2em; margin-top: 8px; }
  ul.events { list-style: none; margin: 0; padding: 0; max-height: 280px; overflow: auto; }
  ul.events li { padding: 6px 0; border-bottom: 1px solid var(--line); }
  .when { color: var(--dim); }
  @media (max-width: 900px) {
    .stats, .grid { grid-template-columns: 1fr; }
    #meta { margin-left: 0; }
    header { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<header>
  <div class="mark">PUNCH</div>
  <div class="sub">tcp tunnel</div>
  <div id="meta"></div>
  <button id="logout" class="hidden" type="button">退出</button>
</header>
<main>
  <section id="login" class="login">
    <h1>管理页</h1>
    <p>输入配置文件里的 api key。页面和接口都在这个二进制里。</p>
    <input id="key" type="password" placeholder="api key" autocomplete="current-password">
    <button id="enter" type="button">进入</button>
    <div id="login-err" class="err"></div>
  </section>
  <section id="app" class="hidden">
    <div class="stats">
      <div class="card"><div class="k">clients</div><div class="v" id="n-clients">0</div></div>
      <div class="card"><div class="k">mappings</div><div class="v" id="n-maps">0</div></div>
      <div class="card"><div class="k">active</div><div class="v" id="n-active">0</div></div>
      <div class="card"><div class="k">bytes in / out</div><div class="v" id="n-bytes">0</div></div>
    </div>
    <div class="grid">
      <div class="panel">
        <h2>开一条映射</h2>
        <label>客户端</label>
        <select id="client"></select>
        <label>服务端监听</label>
        <div class="row">
          <select id="bind-ip">
            <option>0.0.0.0</option>
            <option>127.0.0.1</option>
          </select>
          <input id="bind-port" inputmode="numeric" placeholder="端口">
        </div>
        <label>客户端去连的地址</label>
        <input id="target" placeholder="10.0.0.8:80 或 192.168.1.9:22">
        <div style="margin-top:12px"><button id="create" type="button">创建</button></div>
        <div id="form-err" class="err"></div>
        <p class="sub" style="color:var(--dim)">0.0.0.0 对外，127.0.0.1 只给这台机器。目标可以是客户端能访问的任意 IP 和端口。目标没在 listen 时，这一行会标红。</p>
      </div>
      <div class="panel">
        <h2>事件</h2>
        <ul id="events" class="events"></ul>
      </div>
    </div>
    <div class="panel" style="margin-top:12px">
      <h2>映射</h2>
      <table>
        <thead>
          <tr><th>id</th><th>客户端</th><th>监听</th><th>目标</th><th>连接</th><th>流量</th><th>状态</th><th></th></tr>
        </thead>
        <tbody id="maps"></tbody>
      </table>
    </div>
    <div class="panel" style="margin-top:12px">
      <h2>在线客户端</h2>
      <table>
        <thead><tr><th>名字</th><th>地址</th><th>空闲数据连接</th><th>上线</th></tr></thead>
        <tbody id="clients"></tbody>
      </table>
    </div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const store = "punch.apiKey";

function key() { return sessionStorage.getItem(store) || ""; }

function showApp(on) {
  $("login").classList.toggle("hidden", on);
  $("app").classList.toggle("hidden", !on);
  $("logout").classList.toggle("hidden", !on);
}

async function api(path, opt) {
  opt = opt || {};
  const headers = Object.assign({ "X-Api-Key": key() }, opt.headers || {});
  if (opt.body) headers["Content-Type"] = "application/json";
  const res = await fetch(path, {
    method: opt.method || "GET",
    headers,
    body: opt.body ? JSON.stringify(opt.body) : undefined,
  });
  const text = await res.text();
  let data = null;
  if (text) {
    try { data = JSON.parse(text); } catch (e) { data = { error: text }; }
  }
  if (res.status === 401) {
    sessionStorage.removeItem(store);
    showApp(false);
    throw new Error("api key 无效");
  }
  if (!res.ok) throw new Error((data && data.error) || res.statusText);
  return data;
}

function bytes(n) {
  n = Number(n) || 0;
  const u = ["B", "KB", "MB", "GB", "TB"];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i === 0 ? n.toFixed(0) : n.toFixed(1)) + u[i];
}

function when(ms) {
  if (!ms) return "";
  const d = new Date(ms);
  const p = (n) => String(n).padStart(2, "0");
  return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}

function el(tag, text, cls) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

async function refresh() {
  const [ov, cls, maps, ev] = await Promise.all([
    api("/api/overview"),
    api("/api/clients"),
    api("/api/mappings"),
    api("/api/events"),
  ]);
  $("n-clients").textContent = ov.clients;
  $("n-maps").textContent = ov.mappings;
  $("n-active").textContent = ov.active;
  $("n-bytes").textContent = bytes(ov.bytes_in) + " / " + bytes(ov.bytes_out);
  $("meta").textContent = ov.io + "  ·  " + ov.control;

  const sel = $("client");
  const cur = sel.value;
  sel.replaceChildren();
  (cls.clients || []).forEach((c) => {
    const o = document.createElement("option");
    o.value = c.name;
    o.textContent = c.name + "  " + c.addr;
    sel.appendChild(o);
  });
  if ([...sel.options].some((o) => o.value === cur)) sel.value = cur;

  const tb = $("maps");
  tb.replaceChildren();
  (maps.mappings || []).forEach((m) => {
    const tr = document.createElement("tr");
    const status = m.last_error ? m.last_error : (m.client_online ? "up" : "client offline");
    const clsName = m.last_error ? "bad" : (m.client_online ? "ok" : "warn");
    [
      String(m.id),
      m.client_name + (m.origin === "api" ? " · api" : ""),
      m.bind,
      m.target,
      String(m.active) + " / " + String(m.accepts),
      bytes(m.bytes_in) + " → " + bytes(m.bytes_out),
    ].forEach((t) => tr.appendChild(el("td", t)));
    tr.appendChild(el("td", status, clsName));
    const td = document.createElement("td");
    const b = el("button", "关闭", "danger");
    b.type = "button";
    b.onclick = async () => {
      if (!confirm("关闭 " + m.bind + " ?")) return;
      try { await api("/api/mappings/" + m.id, { method: "DELETE" }); await refresh(); }
      catch (e) { $("form-err").textContent = e.message; }
    };
    td.appendChild(b);
    tr.appendChild(td);
    tb.appendChild(tr);
  });

  const cb = $("clients");
  cb.replaceChildren();
  (cls.clients || []).forEach((c) => {
    const tr = document.createElement("tr");
    [c.name, c.addr, String(c.pool_idle), when(c.connected_ms)].forEach((t) => tr.appendChild(el("td", t)));
    cb.appendChild(tr);
  });

  const ul = $("events");
  ul.replaceChildren();
  (ev.events || []).slice(0, 40).forEach((e) => {
    const li = document.createElement("li");
    li.appendChild(el("span", when(e.ts_ms) + "  ", "when"));
    const hot = e.kind === "listen_fail" || e.kind === "bind_fail";
    li.appendChild(el("span", e.kind + "  " + (e.client_name || "") + "  " + e.message, hot ? "bad" : ""));
    ul.appendChild(li);
  });
}

$("enter").onclick = async () => {
  sessionStorage.setItem(store, $("key").value.trim());
  $("login-err").textContent = "";
  try {
    await api("/api/ping");
    showApp(true);
    await refresh();
  } catch (e) {
    $("login-err").textContent = e.message;
  }
};

$("logout").onclick = () => {
  sessionStorage.removeItem(store);
  showApp(false);
};

$("create").onclick = async () => {
  $("form-err").textContent = "";
  const name = $("client").value;
  if (!name) { $("form-err").textContent = "还没有在线客户端"; return; }
  try {
    const out = await api("/api/mappings", {
      method: "POST",
      body: {
        client_name: name,
        bind: $("bind-ip").value + ":" + $("bind-port").value.trim(),
        target: $("target").value.trim(),
      },
    });
    if (out.warning) $("form-err").textContent = out.warning;
    $("target").value = "";
    await refresh();
  } catch (e) {
    $("form-err").textContent = e.message;
  }
};

$("key").addEventListener("keydown", (e) => { if (e.key === "Enter") $("enter").click(); });

if (key()) {
  showApp(true);
  refresh().catch((e) => {
    showApp(false);
    $("login-err").textContent = e.message;
  });
}
setInterval(() => {
  if (!$("app").classList.contains("hidden")) refresh().catch(() => {});
}, 2000);
</script>
</body>
</html>
